lr: 8e-5
feature_dim: 100
num_train_frames: 30100000
stddev_schedule: 'linear(1.0,0.1,2000000)'

params:  
  diff_env:
    name: HumanoidEnv
    stochastic_env: False # True
    episode_length: 1000
    MM_caching_frequency: 48
  
  network:
    actor: ActorStochasticMLP
    actor_mlp:
      units: [256, 128]
      activation: elu

    critic: CriticMLP
    critic_mlp:
      units: [128, 128]
      activation: elu
  
  general:
    device: cuda:0
    render: False 
    seed: 0
    train: True
  
  config:
    name: df_humanoid_dva
    dmc_render_model: humanoid
    actor_learning_rate: 2e-3 # adam
    critic_learning_rate: 5e-4 # adam
    lr_schedule: linear # ['constant', 'linear']
    target_critic_alpha: 0.995
    state_obs_rms: True
    ret_rms: False
    critic_iterations: 16
    critic_method: td-lambda 
    lambda: 0.95
    num_batch: 4
    gamma: 0.99
    betas: [0.7, 0.95] # adam
    max_epochs: 4000
    steps_num: 32
    grad_norm: 1.0 
    truncate_grads: True
    num_actors: 32 
    # visual observation related
    vis_obs: True
    img_height: 84
    img_width: 84
    img_aug: False
    img_aug_padding: 4
    save_interval: 400

    player:
      determenistic: True
      games_num: 1
      num_actors: 1
      print_stats: True
      render_mode: dmc # ['usd', 'dmc']
