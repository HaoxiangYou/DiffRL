params:  
  diff_env:
    name: AntEnv
    stochastic_env: True
    episode_length: 1000
    MM_caching_frequency: 16

  network:
    actor: ActorStochasticMLP # ActorDeterministicMLP
    actor_mlp:
      units: [128, 64, 32]
      activation: elu

    critic: CriticMLP
    critic_mlp:
      units: [64, 64]
      activation: elu

  config:
    name: df_ant_dva
    actor_learning_rate: 2e-3 # adam
    critic_learning_rate: 2e-3 # adam
    lr_schedule: linear # ['constant', 'linear']
    target_critic_alpha: 0.2
    state_obs_rms: True
    ret_rms: False
    critic_iterations: 16
    critic_method: td-lambda # ['td-lambda', 'one-step']
    lambda: 0.95
    num_batch: 4
    gamma: 0.99
    betas: [0.7, 0.95] # adam
    max_epochs: 2000
    steps_num: 32
    grad_norm: 1.0 
    truncate_grads: True 
    num_actors: 64
    # visual observation related
    vis_obs: False
    img_height: 84 # only valid when 'vis_obs' = True
    img_width: 84 # only valid when 'vis_obs' = True
    # policy update
    policy_update_method: trajopt-supervised # ['gradient-descent', 'trajopt-supervised'] 
    trajopt_learning_rate: 1e-2 # only valid when 'policy_update_method' = 'trajopt-supervised'
    # img_aug: False # only valid when 'vis_obs' = True and 'policy_update_method' = 'trajopt-supervised'
    # img_aug_padding: 4 # only valid when 'img_aug' = True, 'vis_obs' = True and 'policy_update_method' = 'trajopt-supervised'
    save_interval: 400

    player:
      determenistic: True
      games_num: 1
      num_actors: 1
      print_stats: True